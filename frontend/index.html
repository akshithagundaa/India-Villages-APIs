<!DOCTYPE html>

<html>
<head>
    <title>Village Address Form</title>

```
<style>
    body {
        font-family: Arial;
        background: linear-gradient(to right, #5f7cff, #8b5cf6);
        display: flex;
        justify-content: center;
        margin-top: 80px;
    }

    .container {
        width: 400px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    .dropdown {
        border: 1px solid #ccc;
        max-height: 150px;
        overflow-y: auto;
        border-radius: 6px;
    }

    .item {
        padding: 8px;
        cursor: pointer;
    }

    .item:hover {
        background: #5f7cff;
        color: white;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #5f7cff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #status {
        margin-top: 15px;
        font-size: 14px;
    }
</style>
```

</head>

<body>

<div class="container">
    <h2>Village Address Form</h2>

```
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="village" placeholder="Search Village">
<div id="dropdown" class="dropdown"></div>

<input type="text" id="subdistrict" placeholder="Subdistrict" readonly>
<input type="text" id="district" placeholder="District" readonly>
<input type="text" id="state" placeholder="State" readonly>

<button id="submitBtn">Submit</button>

<div id="status"></div>
```

</div>

<script>

const input = document.getElementById('village');
const dropdown = document.getElementById('dropdown');

let debounceTimer;

input.addEventListener('input', () => {
    const q = input.value;

    clearTimeout(debounceTimer);

    if (q.length < 2) {
        dropdown.innerHTML = '';
        return;
    }

    debounceTimer = setTimeout(async () => {
        const res = await fetch(`http://localhost:3000/api/autocomplete?q=${q}`);
        const result = await res.json();

        dropdown.innerHTML = '';

        result.data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = item.fullAddress;

            div.onclick = () => {
                input.value = item.hierarchy.village;

                document.getElementById('subdistrict').value = item.hierarchy.subdistrict;
                document.getElementById('district').value = item.hierarchy.district;
                document.getElementById('state').value = item.hierarchy.state;

                dropdown.innerHTML = '';
            };

            dropdown.appendChild(div);
        });

    }, 300);
});

document.getElementById('submitBtn').addEventListener('click', () => {

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;

    const village = document.getElementById('village').value;
    const subdistrict = document.getElementById('subdistrict').value;
    const district = document.getElementById('district').value;
    const state = document.getElementById('state').value;

    document.getElementById('status').innerText =
        "Saved:\n" +
        name + ", " + phone + "\n" +
        village + ", " + subdistrict + ", " + district + ", " + state + ", India";
});

</script>

</body>
</html>
